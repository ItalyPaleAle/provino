<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · provino example</title>
  <style>
    :root {
      --bg: #f6f6f3; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --border: #e3e3de; --accent: #2f5bd3;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151514; --surface: #1f1f1d; --text: #ececea; --muted: #9b9b95; --border: #33332f; --accent: #7b9cff; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.5; }
    header { padding: 0.9rem 16px; border-bottom: 1px solid var(--border); background: var(--surface); font-weight: 700; }
    header span { font-weight: 400; color: var(--muted); }
    main { max-width: 560px; margin: 2rem auto; padding: 0 16px; }
    section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; }
    h1 { margin: 0 0 0.5rem; font-size: 1.6rem; }
    p { color: var(--muted); }
    form { display: grid; gap: 0.75rem; margin-top: 1rem; }
    button { font: inherit; cursor: pointer; display: grid; gap: 0.15rem; text-align: left; padding: 0.9rem 1rem; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); }
    button:hover, button:focus-visible { border-color: var(--accent); }
    button span { color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>provino <span>example app</span></header>
  <main>
    <section>
      <h1>Sign in</h1>
      <p>These are test accounts, so there's no password. Pick one to get a token for provino.</p>
      <form method="post" action="/oauth/authorize">
        <input type="hidden" name="response_type" value="code">
        <input type="hidden" name="client_id" value="{{.Params.ClientID}}">
        <input type="hidden" name="redirect_uri" value="{{.Params.RedirectURI}}">
        <input type="hidden" name="state" value="{{.Params.State}}">
        {{range .Accounts}}
        <button type="submit" name="account" value="{{.ID}}">
          <strong>{{.Name}}</strong>
          <span>{{.Description}}</span>
        </button>
        {{end}}
      </form>
    </section>
  </main>
</body>
</html>
