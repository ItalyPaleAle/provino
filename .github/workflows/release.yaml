name: Build and publish

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  # The tags, labels, and build information are computed once, so the image of every architecture carries the same build date
  metadata:
    name: Image metadata
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.vars.outputs.image }}
      json: ${{ steps.meta.outputs.json }}
      labels: ${{ steps.meta.outputs.labels }}
      ldflags: ${{ steps.vars.outputs.ldflags }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      # Lowercase REPO_OWNER which is required for containers
      - name: Set lowercase REPO_OWNER
        run: |
          REPO_OWNER=${{ github.repository_owner }}
          echo "REPO_OWNER=${REPO_OWNER,,}" >>${GITHUB_ENV}

      - name: Generate container tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # The annotations go on the multi-arch index that the tags point at, which is the manifest the registry shows
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ghcr.io/${{ env.REPO_OWNER }}/provino
          tags: |
            type=edge,branch=main
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - name: Set variables
        id: vars
        run: |
          BUILD_ID=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          BUILD_VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          COMMIT_HASH=$(echo "${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}" | head -c 7)

          echo "BUILD_ID: '$BUILD_ID'"
          echo "BUILD_VERSION: '$BUILD_VERSION'"
          echo "BUILD_DATE: '$BUILD_DATE'"
          echo "COMMIT_HASH: '$COMMIT_HASH'"

          BUILDINFO_PKG="github.com/italypaleale/provino/internal/buildinfo"
          BUILD_LDFLAGS="-X ${BUILDINFO_PKG}.Production=1 -X ${BUILDINFO_PKG}.AppVersion=${BUILD_VERSION} -X ${BUILDINFO_PKG}.BuildId=${BUILD_ID} -X ${BUILDINFO_PKG}.BuildDate=${BUILD_DATE} -X ${BUILDINFO_PKG}.CommitHash=${COMMIT_HASH} -buildid=${BUILD_ID}"

          echo "ldflags=$BUILD_LDFLAGS" >> $GITHUB_OUTPUT
          echo "version=$BUILD_VERSION" >> $GITHUB_OUTPUT
          echo "image=ghcr.io/${REPO_OWNER}/provino" >> $GITHUB_OUTPUT

          echo "BUILD_LDFLAGS: '$BUILD_LDFLAGS'"

  # provino links against libvips through cgo, so the image compiles the binary inside the build rather than copying in one built on the runner
  # That also makes it a container-only release: the binary is dynamically linked, so there are no standalone archives to publish alongside it
  # A cgo build runs on the architecture it targets, so each architecture is built on a runner of its own, which is far faster than compiling under emulation
  container:
    name: Container image (${{ matrix.platform }})
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Do not cache in release workflows
          cache-binary: false

      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image is pushed by digest alone: the manifest job tags the index that combines every architecture
      - name: Build and push Container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: docker-build-push
        with:
          outputs: type=image,name=${{ needs.metadata.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ needs.metadata.outputs.labels }}
          platforms: ${{ matrix.platform }}
          context: .
          file: Dockerfile
          build-args: |
            BUILD_LDFLAGS=${{ needs.metadata.outputs.ldflags }}

      # Each digest is passed on as the name of an empty file, which is all the manifest job needs to find the image
      - name: Export the digest
        run: |
          DIGEST="${{ steps.docker-build-push.outputs.digest }}"
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

          PLATFORM="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> $GITHUB_ENV

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          # Do not cache in release workflows
          cache: false

      # The SBOM must describe the binary that ships, and that binary only exists inside the image, so it is copied out of the image just pushed rather than built again on the runner
      - name: Extract the binary from the image
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          DIGEST: ${{ steps.docker-build-push.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eo pipefail

          # A container that is created but never started is enough to copy a file out of, and the distroless image has nothing to start anyway
          CONTAINER_ID=$(docker create --platform "${PLATFORM}" "${IMAGE}@${DIGEST}")
          mkdir -p "${RUNNER_TEMP}/bin"
          docker cp -L "${CONTAINER_ID}:/bin/provino" "${RUNNER_TEMP}/bin/provino"
          docker rm "${CONTAINER_ID}"

          # This fails if the file is not a Go binary, and logs the module list the SBOM is generated from
          go version -m "${RUNNER_TEMP}/bin/provino"

      # One CycloneDX SBOM per architecture, generated from the module list that Go embeds in the binary
      # It lists the Go modules only: libvips and the other system libraries in the image come from Debian packages, which Go's build information does not record
      - name: Generate the SBOM
        env:
          # Pinned to an exact release that is at least a week old
          # `go install pkg@version` ignores this repo's go.mod and verifies the downloaded modules against sum.golang.org
          CYCLONEDX_GOMOD_VERSION: "v1.12.0"
          BUILD_VERSION: ${{ needs.metadata.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eo pipefail

          GOBIN="${RUNNER_TEMP}/tools" go install "github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@${CYCLONEDX_GOMOD_VERSION}"

          # The image was built without the repository's .git folder, so the binary records its own version as "(devel)" and the release version is passed in instead
          # cyclonedx-gomod reads the build settings from the binary, but takes the GOOS and GOARCH in package URLs from `go env`, so they are set to match the image's platform
          mkdir -p "${RUNNER_TEMP}/sbom"
          GOOS="${PLATFORM%%/*}" GOARCH="${PLATFORM#*/}" "${RUNNER_TEMP}/tools/cyclonedx-gomod" bin \
            -json \
            -std \
            -version "${BUILD_VERSION}" \
            -output "${RUNNER_TEMP}/sbom/provino-${BUILD_VERSION}-${PLATFORM_PAIR}.cdx.json" \
            "${RUNNER_TEMP}/bin/provino"

          ls -al "${RUNNER_TEMP}/sbom"

      # The SBOM is uploaded on every run, not only for tags, so a build from main can be inspected and a broken step shows up before a release
      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/sbom/*
          if-no-files-found: error

  # Combines the image of every architecture into the multi-arch index each tag points at
  manifest:
    name: Multi-arch image
    needs: [metadata, container]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Do not cache in release workflows
          cache-binary: false

      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch image
        id: index
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          METADATA: ${{ needs.metadata.outputs.json }}
        run: |
          set -eo pipefail

          # Every tag and annotation is an argument of its own, since the annotations contain spaces
          ARGS=()
          while IFS= read -r TAG; do
            ARGS+=(--tag "$TAG")
          done < <(jq -r '.tags[]' <<< "$METADATA")
          while IFS= read -r ANNOTATION; do
            ARGS+=(--annotation "$ANNOTATION")
          done < <(jq -r '.annotations[]' <<< "$METADATA")

          # Every file in this folder is named after the digest of one architecture's image
          for DIGEST in *; do
            ARGS+=("${IMAGE}@sha256:${DIGEST}")
          done

          docker buildx imagetools create "${ARGS[@]}"

          # The attestation is for the index, since that is what every tag resolves to
          INDEX_DIGEST=$(docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$METADATA")" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ -z "$INDEX_DIGEST" || "$INDEX_DIGEST" == "null" ]]; then
            echo "Failed to determine the digest of the multi-arch image"
            exit 1
          fi

          echo "digest=$INDEX_DIGEST" >> $GITHUB_OUTPUT

          echo "INDEX_DIGEST: '$INDEX_DIGEST'"

      - name: Container image attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # 4.2.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-name: ${{ needs.metadata.outputs.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  helm-chart:
    name: Publish Helm chart
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    # The chart pulls the image tagged with its appVersion, so it is only published once that image exists
    needs: manifest
    if: startsWith(github.ref, 'refs/tags/v')

    env:
      HELM_VERSION: "v4.3.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Lowercase REPO_OWNER which is required for containers
      - name: Set lowercase REPO_OWNER
        run: |
          REPO_OWNER=${{ github.repository_owner }}
          echo "REPO_OWNER=${REPO_OWNER,,}" >>${GITHUB_ENV}

      - name: Install Helm
        run: |
          set -eo pipefail

          HELM_TARBALL="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "https://get.helm.sh/${HELM_TARBALL}"
          curl -fsSLO "https://get.helm.sh/${HELM_TARBALL}.sha256sum"
          sha256sum -c "${HELM_TARBALL}.sha256sum"

          tar -xzf "${HELM_TARBALL}" linux-amd64/helm
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          rm -rf "${HELM_TARBALL}" "${HELM_TARBALL}.sha256sum" linux-amd64

          helm version

      - name: Set variables
        run: |
          # The chart is released alongside the service, so its version and appVersion both track the release tag
          # The appVersion drops the tag's "v", which the chart adds back when it picks the image tag
          CHART_VERSION="${GITHUB_REF_NAME#v}"

          # Helm must read Docker's default credentials so the attestation action can reuse the registry login
          HELM_REGISTRY_CONFIG="${HOME}/.docker/config.json"

          echo "CHART_VERSION=$CHART_VERSION" >> $GITHUB_ENV
          echo "HELM_REGISTRY_CONFIG=$HELM_REGISTRY_CONFIG" >> $GITHUB_ENV

          echo "CHART_VERSION: '$CHART_VERSION'"

      - name: Lint and render the chart
        run: |
          make lint-chart

      # Helm and the attestation action use the same Docker-format credential file
      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push the chart
        id: helm-push
        run: |
          set -eo pipefail

          mkdir -p .charts
          helm package helm \
            --version "${CHART_VERSION}" \
            --app-version "${CHART_VERSION}" \
            --destination .charts

          # The chart goes under a "charts" path so its repository does not collide with the container image at ghcr.io/${REPO_OWNER}/provino
          helm push ".charts/provino-${CHART_VERSION}.tgz" "oci://ghcr.io/${REPO_OWNER}/charts" 2>&1 | tee helm-push.log

          CHART_DIGEST=$(grep -oE 'sha256:[0-9a-f]{64}' helm-push.log | head -n 1)
          if [[ -z "$CHART_DIGEST" ]]; then
            echo "Failed to determine the digest of the pushed chart"
            exit 1
          fi

          echo "digest=$CHART_DIGEST" >> $GITHUB_OUTPUT

          echo "CHART_DIGEST: '$CHART_DIGEST'"

      - name: Helm chart attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # 4.2.2
        with:
          subject-name: 'ghcr.io/${{ env.REPO_OWNER }}/charts/provino'
          subject-digest: ${{ steps.helm-push.outputs.digest }}
          push-to-registry: true

  # provino is container-only, so the release marks the tag that the image and the chart published above were built from
  # Its only assets are the SBOMs of the binary in each architecture's image
  release:
    name: Publish release
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: [manifest, helm-chart]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write
      attestations: write
      id-token: write

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch the tag so its annotation message is available for release notes
          fetch-tags: true

      # The container job uploads one SBOM per architecture
      - name: Download the SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: .out
          pattern: sbom-*
          merge-multiple: true

      # A single attestation covering every file attached to the release
      # It runs before the release is created: once the release exists, a rerun stops at the immutability check below and could never add a missing attestation
      - name: Attestation for release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # 4.2.2
        with:
          subject-path: '.out/*'

      - name: Publish release
        run: |
          # Published releases are immutable: re-running the workflow on the same tag must fail, not overwrite
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists, and published releases are immutable"
            exit 1
          fi

          # Tags carrying a pre-release identifier (such as v1.2.0-rc.1) are marked as pre-releases
          prerelease=()
          if [[ "${TAG}" == *-* ]]; then
            echo "Marking ${TAG} as a pre-release"
            prerelease=(--prerelease)
          fi

          # An annotated tag carries a message; use it as the release notes
          # A lightweight tag has no message, so fall back to auto-generated notes
          # Strip any Git signature block from the tag message so it doesn't leak into the release notes
          notes_args=()
          tag_type=$(git tag -l --format='%(objecttype)' "${TAG}")
          if [[ "${tag_type}" == "tag" ]]; then
            tag_message=$(git tag -l --format='%(contents)' "${TAG}")
            tag_signature=$(git tag -l --format='%(contents:signature)' "${TAG}")
            if [[ -n "${tag_signature}" && "${tag_message}" == *"${tag_signature}" ]]; then
              tag_message="${tag_message%"${tag_signature}"}"
            fi
            if [[ -n "${tag_message}" ]]; then
              echo "Using tag annotation as release notes"
              notes_args=(--notes "${tag_message}")
            fi
          fi
          if [[ ${#notes_args[@]} -eq 0 ]]; then
            echo "Tag has no annotation; auto-generating release notes"
            notes_args=(--generate-notes)
          fi

          shopt -s nullglob
          assets=(.out/*)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "::error::No assets found in .out"
            exit 1
          fi

          echo "Attaching ${#assets[@]} assets:"
          printf '  %s\n' "${assets[@]}"

          # Never pass --draft: the release is published immediately, with no approval step
          gh release create "${TAG}" \
            --verify-tag \
            --title "${TAG}" \
            "${prerelease[@]}" \
            "${notes_args[@]}" \
            "${assets[@]}"

      - name: Job summary
        run: |
          url=$(gh release view "${TAG}" --json url --jq '.url')
          {
            echo "## Release ${TAG}"
            echo
            echo "Published: <${url}>"
          } >> "${GITHUB_STEP_SUMMARY}"
