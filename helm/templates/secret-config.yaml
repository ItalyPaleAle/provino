{{- include "provino.validateValues" . -}}
{{- if not .Values.existingConfigSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "provino.configSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "provino.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  config.yaml: |
    {{- include "provino.configFile" . | nindent 4 }}
{{- end }}
