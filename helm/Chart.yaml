apiVersion: v2
name: provino
description: provino, which stores uploaded images and generates their variants in durable jobs
type: application

# Version of the chart itself
# The release workflow overwrites this with the release tag, so these values only apply when installing from a checkout
version: 0.1.0

# Version of provino this chart deploys by default
# Images are tagged "v<version>", which is what the chart pulls when image.tag is empty
appVersion: "0.1.0"

home: https://github.com/italypaleale/provino
sources:
  - https://github.com/italypaleale/provino

keywords:
  - provino
  - images
  - image-optimization
  - thumbnails
  - libvips

maintainers:
  - name: ItalyPaleAle
    url: https://github.com/ItalyPaleAle
